    <pre class="content">在 PC 上，你可以用一些专业的工具来检测文件的真实编码。例如，你可以在 VS Code 或其他更强大的文本编辑器中打开文件。这些编辑器通常有更强的编码自动检测功能。

VS Code：打开文件后，右下角会显示当前文件的编码格式。你可以点击它，然后选择 “通过编码重新打开”，选择 “UTF-8” 或其他你认为可能的编码，看看文件是否能正常显示。如果显示正常了，再点击右下角的编码，选择 “使用编码保存”，并选择 “GBK” 格式。</pre>
